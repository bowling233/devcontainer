name: Build Dev Container

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - k8s/**
      - k8s-packer/**
      - .github/workflows/devcontainers.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - subfolder: k8s
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            opencode_suffix: linux-x64-musl
            codex_suffix: x86_64-unknown-linux-musl
          - subfolder: k8s
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            opencode_suffix: linux-arm64-musl
            codex_suffix: aarch64-unknown-linux-musl
          - subfolder: k8s-packer
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            opencode_suffix: linux-x64
            codex_suffix: x86_64-unknown-linux-musl
          - subfolder: k8s-packer
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            opencode_suffix: linux-arm64
            codex_suffix: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image repository
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}/${{ matrix.subfolder }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Pre-build dev container image (${{ matrix.subfolder }} ${{ matrix.arch }})
        uses: devcontainers/ci@v0.3
        env:
          OPENCODE_SUFFIX: ${{ matrix.opencode_suffix }}
          CODEX_SUFFIX: ${{ matrix.codex_suffix }}
        with:
          subFolder: ${{ matrix.subfolder }}
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          cacheFrom: ${{ env.IMAGE_NAME }}:${{ matrix.arch }}
          push: always

  manifest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        subfolder: [k8s, k8s-packer]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image repository
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}/${{ matrix.subfolder }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:amd64" \
            "${IMAGE_NAME}:arm64"
